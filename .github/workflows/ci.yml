name: CI

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
  push:
  pull_request:

permissions: {}

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache: true
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - name: Fuzz parser smoke tests
        run: |
          go test ./internal/core/template -run=^$ -fuzz=^FuzzParseEnv$ -fuzztime=10s
          go test ./internal/aws -run=^$ -fuzz=^FuzzParseReference$ -fuzztime=10s
          go test ./internal/onepassword -run=^$ -fuzz=^FuzzParseReference$ -fuzztime=10s
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - run: golangci-lint config verify && golangci-lint run ./...
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - run: govulncheck ./...
      - name: Cross-compile Windows permission path
        run: GOOS=windows GOARCH=amd64 go test ./internal/dotenv -c -o /tmp/dotenv.test.exe

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@07d0b0e993009eb3b908ea06e49e88e933b728a2 # v1.17.0
        with:
          node-version: '24.15.0'
          cache: true
      - run: vp install --frozen-lockfile --ignore-scripts
      - run: vp check
      - run: vp test
      - run: vp pack
      - run: test ! -e dist/cli.js.map
      - run: npm audit --audit-level=high
      - run: vp test run test/metadata.test.ts
