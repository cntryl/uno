name: Publish Package

on:
  workflow_dispatch:

permissions: {}
concurrency:
  group: uno-release
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require main
        env:
          REF: ${{ github.ref }}
        run: test "$REF" = refs/heads/main

  ci:
    needs: authorize
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  native:
    needs: ci
    uses: ./.github/workflows/native.yml
    permissions:
      contents: read

  release:
    needs: [ci, native]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
          registry-url: https://registry.npmjs.org

      - name: Bootstrap npm
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@12.0.2

      - name: Check out repository at the tested commit
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.6'
          cache: true

      - name: Download Darwin arm64 binary
        uses: actions/download-artifact@v8.0.1
        with:
          name: native-darwin-arm64
          path: native/darwin-arm64

      - name: Download Darwin x64 binary
        uses: actions/download-artifact@v8.0.1
        with:
          name: native-darwin-x64
          path: native/darwin-x64

      - name: Download Linux arm64 glibc binary
        uses: actions/download-artifact@v8.0.1
        with:
          name: native-linux-arm64-glibc
          path: native/linux-arm64-glibc

      - name: Download Linux arm64 musl binary
        uses: actions/download-artifact@v8.0.1
        with:
          name: native-linux-arm64-musl
          path: native/linux-arm64-musl

      - name: Download Linux x64 glibc binary
        uses: actions/download-artifact@v8.0.1
        with:
          name: native-linux-x64-glibc
          path: native/linux-x64-glibc

      - name: Download Linux x64 musl binary
        uses: actions/download-artifact@v8.0.1
        with:
          name: native-linux-x64-musl
          path: native/linux-x64-musl

      - name: Download Windows arm64 binary
        uses: actions/download-artifact@v8.0.1
        with:
          name: native-win32-arm64
          path: native/win32-arm64

      - name: Download Windows x64 binary
        uses: actions/download-artifact@v8.0.1
        with:
          name: native-win32-x64
          path: native/win32-x64

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Assemble the eight-binary package
        run: |
          mkdir -p release
          chmod +x native/darwin-arm64/uno native/darwin-x64/uno native/linux-arm64-glibc/uno native/linux-arm64-musl/uno native/linux-x64-glibc/uno native/linux-x64-musl/uno
          npm pack --pack-destination release

      - name: Generate CycloneDX SBOM
        run: |
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.10.0
          cyclonedx-gomod app -json -output release/uno.cdx.json -main cmd/uno .

      - name: Sign native binaries and create checksums
        run: |
          cosign sign-blob --yes --bundle release/native-darwin-arm64-uno.sigstore.json native/darwin-arm64/uno
          cosign sign-blob --yes --bundle release/native-darwin-x64-uno.sigstore.json native/darwin-x64/uno
          cosign sign-blob --yes --bundle release/native-linux-arm64-glibc-uno.sigstore.json native/linux-arm64-glibc/uno
          cosign sign-blob --yes --bundle release/native-linux-arm64-musl-uno.sigstore.json native/linux-arm64-musl/uno
          cosign sign-blob --yes --bundle release/native-linux-x64-glibc-uno.sigstore.json native/linux-x64-glibc/uno
          cosign sign-blob --yes --bundle release/native-linux-x64-musl-uno.sigstore.json native/linux-x64-musl/uno
          cosign sign-blob --yes --bundle release/native-win32-arm64-uno.exe.sigstore.json native/win32-arm64/uno.exe
          cosign sign-blob --yes --bundle release/native-win32-x64-uno.exe.sigstore.json native/win32-x64/uno.exe
          test "$(find release -name '*.sigstore.json' -type f | wc -l)" -eq 8
          cp --parents native/*/uno native/*/uno.exe release/
          find release -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > release/SHA256SUMS

      - name: Verify packed archive
        run: node scripts/verify-package.mjs release/*.tgz

      - name: Verify release artifacts
        env:
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/publish.yml@refs/heads/main
        run: |
          sha256sum --check release/SHA256SUMS
          jq -e '.bomFormat == "CycloneDX"' release/uno.cdx.json >/dev/null
          test "$(find release/native -type f \( -name uno -o -name uno.exe \) | wc -l)" -eq 8
          test "$(find release -name '*.sigstore.json' -type f | wc -l)" -eq 8
          archives=(release/*.tgz)
          test "${#archives[@]}" -eq 1
          package_dir="$(mktemp -d)"
          tar -xzf "${archives[0]}" -C "$package_dir"
          for binary in release/native/*/uno release/native/*/uno.exe; do
            test -f "$binary" || continue
            relative="${binary#release/}"
            bundle="release/${relative//\//-}.sigstore.json"
            cmp "$binary" "$package_dir/package/$relative"
            cosign verify-blob "$binary" \
              --bundle "$bundle" \
              --certificate-identity "$CERTIFICATE_IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
          done

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: npm-package-${{ github.sha }}
          path: release/
          if-no-files-found: error

      - name: Tag the exact tested commit
        env:
          SHA: ${{ github.sha }}
        run: |
          TAG="v$(jq -r .version package.json)"
          git fetch --force --tags origin
          if git rev-parse --verify --quiet "refs/tags/$TAG"; then
            test "$(git rev-list -n1 "$TAG")" = "$SHA"
          else
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git tag "$TAG" "$SHA"
            git push origin "refs/tags/$TAG"
          fi

      - name: Publish to npm
        run: npm publish ./release/*.tgz --access public --provenance
