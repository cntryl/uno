name: Publish Package

on:
  workflow_dispatch:

permissions: {}
concurrency:
  group: uno-release
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require main
        env:
          REF: ${{ github.ref }}
        run: test "$REF" = refs/heads/main

  ci:
    needs: authorize
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache: true
      - uses: voidzero-dev/setup-vp@07d0b0e993009eb3b908ea06e49e88e933b728a2 # v1.17.0
        with:
          node-version: '24.15.0'
          cache: true
      - run: vp install --frozen-lockfile --ignore-scripts
      - name: Build six native binaries
        run: |
          mkdir -p native/{darwin-arm64,darwin-x64,linux-arm64,linux-x64,win32-arm64,win32-x64} release
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags='-s -w' -o native/darwin-arm64/uno ./cmd/uno
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o native/darwin-x64/uno ./cmd/uno
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags='-s -w' -o native/linux-arm64/uno ./cmd/uno
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o native/linux-x64/uno ./cmd/uno
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -trimpath -ldflags='-s -w' -o native/win32-arm64/uno.exe ./cmd/uno
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o native/win32-x64/uno.exe ./cmd/uno
          vp pack
          npm pack --pack-destination release
          sha256sum release/*.tgz > release/SHA256SUMS
      - run: node scripts/verify-package.mjs release/*.tgz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package-${{ github.sha }}
          path: release/
          if-no-files-found: error

  tag:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - id: version
        run: echo "tag=v$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
      - name: Tag the exact tested commit
        env:
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          git fetch --force --tags origin
          if git rev-parse --verify --quiet "refs/tags/$TAG"; then
            test "$(git rev-list -n1 "$TAG")" = "$SHA"
          else
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git tag "$TAG" "$SHA"
            git push origin "refs/tags/$TAG"
          fi

  publish:
    needs: [build, tag]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.15.0'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package-${{ github.sha }}
          path: release
      - run: sha256sum --check release/SHA256SUMS
      - run: npm publish ./release/*.tgz --access public --provenance
