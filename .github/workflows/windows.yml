name: Build Windows Binaries

on:
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win32-arm64
            runner: windows-11-arm
          - target: win32-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Check out repository at the tested commit
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.6'
          cache: true

      - name: Build and verify Windows binary
        shell: bash
        run: |
          binary="native/${{ matrix.target }}/uno.exe"
          mkdir -p "$(dirname "$binary")"
          CGO_ENABLED=1 go build -trimpath -ldflags='-s -w' -o "$binary" ./cmd/uno
          "./$binary" --version

      - name: Upload Windows binary
        uses: actions/upload-artifact@v7.0.1
        with:
          name: native-${{ matrix.target }}
          path: native/${{ matrix.target }}/uno.exe
          if-no-files-found: error
